<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memes y Humor | FUTBOL DE TODO EL MUNDO</title>
    <meta name="description" content="Los mejores memes, risas y humor sobre fútbol internacional en FUTBOL DE TODO EL MUNDO." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-[#060911] text-slate-100 flex flex-col min-h-screen">
    <header></header>

    <main class="flex-1 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-8">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-[#1e2a45] pb-6">
        <div>
          <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-neon/10 border border-neon/30 text-neon text-[11px] font-bold uppercase tracking-wider mb-1">
            <span>Sátira & Reacciones</span>
          </div>
          <h1 class="text-2xl sm:text-3xl font-black text-white">Memes de Fútbol Mundial</h1>
          <p class="text-xs sm:text-sm text-slate-400 mt-1">Las reacciones más virales y el mejor humor futbolero de la comunidad de Miembros.</p>
        </div>

        <button id="open-upload-meme-btn" class="btn-neon text-xs py-2.5 px-4 self-start sm:self-auto shadow-neon-sm">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          <span>Subir Meme</span>
        </button>
      </div>

      <!-- Upload Meme Modal/Box (hidden by default) -->
      <div id="upload-meme-box" class="hidden fresh-card p-5 border-neon/50 space-y-4">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-neon"></span>
          <span>Compartir un Meme Futbolero como Miembro</span>
        </h3>
        <form id="upload-meme-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Título o pie del meme</label>
            <input type="text" id="meme-title-input" required placeholder="Ej: Cuando tu equipo remonta en el minuto 94..." class="fresh-input text-xs" />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">Subir Archivo de Imagen</label>
              <input type="file" id="meme-file-input" accept="image/*" class="text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-[#0c1220] file:text-slate-200 hover:file:bg-[#131c30]" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-300 mb-1">O bien URL directa de imagen</label>
              <input type="url" id="meme-url-input" placeholder="https://..." class="fresh-input text-xs" />
            </div>
          </div>

          <div class="flex justify-end gap-2">
            <button type="button" id="cancel-meme-btn" class="btn-secondary text-xs">Cancelar</button>
            <button type="submit" id="submit-meme-btn" class="btn-neon text-xs">Publicar Meme</button>
          </div>
        </form>
      </div>

      <!-- Memes Gallery Grid -->
      <div id="memes-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full py-12 text-center text-xs text-slate-500">Cargando memes...</div>
      </div>
    </main>

    <footer></footer>

    <script type="module" src="/src/js/pages/memes.js"></script>
  </body>
</html>
